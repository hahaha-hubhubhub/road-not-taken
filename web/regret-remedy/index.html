<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f3f2"><title>后悔药 · 没走的路</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a class="wordmark" href="./">没走的路<span>THE OTHER YOU</span></a><button class="quiet" id="reset" hidden>重新开始 ↗</button></header>
<main>
<section class="screen home" id="home" aria-labelledby="home-title">
<div class="home-copy"><p class="aside">如果，有如果。</p><h1 id="home-title">后悔药</h1><p class="tagline">配合捶胸顿足食用。</p></div>
<button class="bottle-button" id="bottle" aria-label="打开药瓶，取出一颗后悔药">
<span class="bottle" aria-hidden="true"><span class="cap"></span><span class="neck"></span><span class="glass"><span class="label"><span class="label-en">REGRET REMEDY</span><strong>后悔药</strong><span class="label-rule"></span><span class="label-small">给所有「如果当时」</span><span class="label-bottom">1 CAPSULE / 1 OTHER LIFE</span></span></span></span>
</button>
<p class="instruction" id="bottle-hint">轻点药瓶，取一颗。</p>
</section>
<section class="screen pill-screen" id="pill-screen" hidden aria-labelledby="pill-title"><p class="aside">一次未发生的可能。</p><button id="pill" class="pill-button" aria-label="点击药丸，写下遗憾"><span class="capsule"><i></i><i></i></span></button><h2 id="pill-title">这一颗，留给哪个如果？</h2><p class="instruction">点它，说说那件事。</p></section>
<section class="screen input-screen" id="input-screen" hidden aria-labelledby="input-title"><div class="mini-pill" aria-hidden="true"></div><p class="aside">不用整理得很完美。</p><h2 id="input-title">如果当时我……</h2><form id="regret-form"><label class="sr-only" for="regret">你想重新看看的选择</label><textarea id="regret" maxlength="1000" rows="3" placeholder="去了另一座城市，&#10;学了自己喜欢的专业，&#10;或者，把那句话说出口。" required></textarea><div class="input-meta"><span>可以补充地点、当时的选择、你舍不得的事。</span><span id="counter">0 / 1000</span></div><p id="error" role="alert" hidden></p><button class="action" type="submit">吞下这颗后悔药 <span>↗</span></button></form><button class="quiet" id="demo-choice" hidden>查看预写演示案例</button><a class="quiet" href="/">模型设置 ↗</a><button class="quiet back" data-back="pill-screen">先放回去</button></section>
<section class="screen swallowing" id="swallowing" hidden aria-live="polite"><div class="swallow-dot"></div><h2>你已经吞下了<br>这颗后悔药。</h2><p class="instruction">让那个「如果」，发生一次。</p></section>
<section class="screen story-screen" id="story-screen" hidden aria-labelledby="story-title"><div class="story-top"><span id="chapter">第一幕</span><div class="progress" aria-label="故事进度"><i></i><i></i><i></i></div></div><p class="origin" id="origin"></p><h2 id="story-title"></h2><div class="scene" id="scene" aria-hidden="true"><div class="scene-window"><div class="sun"></div><div class="horizon"></div><div class="stair s1"></div><div class="stair s2"></div><div class="stair s3"></div><div class="stair s4"></div><div class="person"></div></div><span class="scene-line"></span></div><p class="narrative" id="narrative"></p><button class="action" id="next">看看后来 <span>→</span></button><button class="quiet" id="prev" hidden>← 回到上一幕</button></section>
<section class="screen envelope-screen" id="envelope-screen" hidden aria-labelledby="envelope-title"><p class="aside">旅程到这里，还没有结束。</p><div class="envelope" aria-hidden="true"><div class="envelope-letter"></div><div class="envelope-flap"></div><div class="envelope-front"></div><span class="envelope-seal">你</span></div><h2 id="envelope-title">有人给你留了一封信。</h2><button class="action" id="open-letter">看看是谁 <span>↗</span></button></section>
<section class="screen letter-screen" id="letter-screen" hidden aria-labelledby="letter-title"><p class="aside">寄件人：另一条时间线里的你</p><h2 id="letter-title">原来，是我。</h2><article class="letter"><p class="salutation">给现在的我：</p><div id="letter-body"></div><p class="signature">另一个你</p></article><div class="letter-actions"><button class="action" id="save">把这封信带走 <span>↓</span></button><button class="quiet" id="again">再打开一个如果 ↗</button></div><p class="saved" id="saved" role="status" hidden></p></section>
<section class="screen input-screen" id="care-screen" hidden><h2>今天，先照顾现在的你。</h2><p class="narrative" id="care-copy"></p><button class="quiet" id="care-again">重新开始</button></section>
</main>
<footer><span>一场虚构的平行人生体验</span><span id="generation-status" role="status">准备好写下你的那个如果</span></footer>
<script src="app.js"></script>
</body></html>
